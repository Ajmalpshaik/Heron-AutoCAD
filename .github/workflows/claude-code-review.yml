name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
# One review per pull request at a time: a newer push cancels the review of the
# older one, so two pushes a few seconds apart do not spend the owner's Claude
# allowance twice (the same rule as Heron AI for Revit).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # A draft is reviewed when it is marked ready. Dependabot's pull requests
    # get no secrets, so a review there could only fail.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The code-review command reads the PR with gh, runs helper agents
          # (Task) and posts its summary with `gh pr comment` - all must be
          # allowed. This list is Heron AI for Revit's, where the review works.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Task,Read,Glob,Grep"'
      # The action hides Claude's answer, even in a debug re-run. Every real
      # review here has stopped in about 2 seconds before reaching the model
      # (issue #34), so on a failure print only Claude's own short answer (a
      # sign-in, access or usage message) to say what to fix. It is Claude's
      # reply text, never the token; GitHub masks secrets in the log as well.
      - name: Why the review failed
        if: failure()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$f" ]; then
            echo "Claude never started: there is no output file."
            exit 0
          fi
          jq -r '(if type == "array" then .[] else . end)
                 | select(type == "object" and .type == "result")
                 | "Claude answered: " + ((.result // "no message") | tostring | .[0:300])' "$f" \
            || echo "The output file could not be read as JSON."
