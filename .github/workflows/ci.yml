name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI builds and tests, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # COM and pywin32 are Windows-only; AutoCAD is not on the runner, so live tests are skipped.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Offline tests
        run: python -m pytest -m "not live"
      - name: Structure
        run: python tools/check_structure.py

  plugin:
    # Builds the add-in for AutoCAD 2021-2024 (net48), 2025-2026 (net8) and 2027 (net10)
    # against Autodesk's reference packages, and runs the bridge's offline tests.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build all three
        run: dotnet build autocad/Heron.AutoCAD.sln -c Release
      - name: Bridge tests
        run: dotnet test autocad/Heron.AutoCAD.Bridge.Tests -c Release
